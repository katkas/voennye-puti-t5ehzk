const STORY=`
<h2>Четыре дедушки и бабушки, две стороны</h2>
<p>У отца Екатерины, <a href="#" data-id="mikhail">Михаила Романовича Скоробогатова</a>, родителями были <a href="#" data-id="roman">Роман Иванович Скоробогатов</a> и <a href="#" data-id="fanya">Фаня Павловна Геер</a>. У мамы, Ирины Анатольевны, были <a href="#" data-id="anatoly">Анатолий Иванович Постовалов</a> и <a href="#" data-id="nina">Нина Николаевна Баженова</a>. Отца Анатолия, <a href="#" data-id="ivan_po">Ивана Даниловича Постовалова</a>, назвал список 1942 года, и семья подтвердила имя.</p>
<h2>Геер: от польской границы до Тюмени</h2>
<p>Акт о рождении Фани называет её родителей: <a href="#" data-id="pavel">Павел Давидович Геер</a>, педагог, и <a href="#" data-id="mina">Мина Львовна</a>. Павел родился около 1893 года в местечке Домачево, теперь это Брестская область на границе с Польшей. Фаня родилась 14 ноября 1920 года в Рыбинске. По рассказам, до войны она жила в Павловске под Петербургом, а призвал её 2 августа 1941 года Тюменский горвоенкомат. Роман служил в том же 380-м медико-санитарном батальоне 229-й дивизии. Батальон начали формировать в декабре 1941 года в Ишиме (теперь Тюменская область), и это, скорее всего, объясняет, почему в его списках много женщин из Тюмени и Ишима.</p>
<p>Оба записаны пропавшими без вести: Фаня 20 августа 1942 года, Роман 1 декабря. Дивизия в те недели держала реку Чир, со 2 августа вошла в 62-ю армию, а с 7 по 12 августа её разгромили в Калачском котле в излучине Дона. В самом Сталинграде она не воевала, а «Сталинградская область» в списке означает область, куда входят Суровикино и Калач. 20 августа в дивизии насчитали 278 штыков, а в сентябре её отвели на отдых под Москву.</p>
<p>Семья рассказывает, что обоих демобилизовали из-за новорождённого Юры. Юра родился 1 февраля 1943 года, значит, в августе 1942 года Фаня была примерно на третьем месяце беременности. Дата рождения согласуется с этим рассказом, хотя сама его не доказывает.</p>
<p>После войны, по словам семьи, Фаня жила в Тюмени и никуда оттуда не уезжала. Консультант называл Новохопёрск в 1943 году и Киев в 1944, и документы Киев не подтверждают: после января 1943 года 229-я дивизия шла через Волховский фронт и Прибалтику. Где Фаня служила после августа 1942 года, ни один документ не говорит. Место рождения Юры тоже не установлено: Воронежская область (по рассказу родных), Новохопёрск (консультант), Волгоград (Geni). Если Фаня не покидала Тюмень, вероятнее всего Тюмень, но это вывод, и решит его запись о рождении.</p>
<h2>Постоваловы: Анатолий и его отец</h2>
<p>Анатолий родился в 1924 году в деревне Кокшары Махнёвского района Свердловской области. Список уточнения потерь 798-го стрелкового полка 140-й дивизии (пункт 198) называет лейтенанта Постовалова Анатолия Ивановича, командира взвода, 1924 года рождения, и его отца, Ивана Даниловича. Больше об Иване Даниловиче ничего не известно: его нет в Geni, неизвестны годы жизни и жена.</p>
<h2>Баженовы и Даниловы: Сатка на Урале</h2>
<p>Жена Анатолия, Нина, родом из Сатки, Челябинская область. Материнская линия известна по Geni и уходит глубоко в Сатку: <a href="#" data-id="petr_b">Пётр Баженов</a> родился там в 1832 году, <a href="#" data-id="fedor_d">Фёдор Данилов</a> в 1811.</p>
<p><a href="#" data-id="nikolai_b">Николай Баженов</a>, отец Нины, по мемуарам родственника был директором Первоуральского новотрубного завода. В списке директоров завода есть Н. И. Баженов, 1937–1938 годы, после И. С. Мельникова и перед Я. П. Осадчим. В списке только инициалы и годы, так что личность держится на мемуарах. Почему Баженов ушёл с поста, ни один найденный источник не говорит.</p>
<p>Книга Данилова «Я летал на самолётах, летаю и буду летать» нашлась: её загрузили на Geni как документ из 94 страниц с распознанным текстом. Баженова она называет два раза и без имени. В 1936 году автору было 14, он приехал в Свердловск, и «муж тёти Кати» был директором Первоуральского новотрубного завода Баженовым. Тётя Катя это Екатерина Николаевна Данилова, мать Нины. Второй раз Баженов появляется в военные годы как директор «трубного завода», уже без слова «новотрубного». Здесь два несовпадения: книга ставит его на завод в 1936 году, а список с 1937, и в войну директором был Осадчий. Либо автор называет завод по семейной привычке, либо речь о другом первоуральском заводе, Старотрубном. Решат это документы завода в архиве Свердловской области.</p>
<h2>Куда всё сходится</h2>
<p>Если раскрасить веер по местам, видно две разные географии. Отцовские предки идут с запада: Беларусь у польской границы, Рыбинск на Волге, Подмосковье, потом Павловск под Петербургом. Материнские почти все с Урала: Сатка, Кокшары, потом Екатеринбург. Екатерина родилась в Тюмени, где с 1945 года жили Фаня и Роман. Две линии не встречаются нигде, кроме её собственной семьи.</p>
<p class="hint">Нажми «Регионы» в верхней панели, чтобы увидеть это на веере. Для самой Мины и для Екатерины Даниловой место рождения неизвестно, они серые.</p>
<h2>Как шёл поиск</h2>
<h2 style="font-size:16px">Фаня, а не Фаина</h2>
<p>В семье бабушку знали как Фаину. В акте о рождении она Фаня, и в военных документах тоже. Фаиной она стала только в свидетельстве о браке. Без этого имени поиск по базам мог бы пройти мимо неё.</p>
<h2 style="font-size:16px">Двое пропавших без вести и мальчик 1943 года</h2>
<p>Семья рассказывает, что молодых супругов демобилизовали из-за новорождённого Юры и что без вести никто не пропадал. В Памяти народа обоих числят пропавшими: Фаню с 20 августа 1942 года, Романа с 1 декабря, как записал Клинский военкомат. Приказ 1943 года отменяет запись о Фане, потому что Тюменский военкомат сообщил, что она служит в Красной Армии. Вторая половина семейного рассказа документам противоречит, первая им не противоречит. Обе версии сохранены, пока не найдены дело ЦАМО Ф.58 Оп.818883 Д.1755, приказ Ф.56 Оп.12220 Д.79 и запись о рождении Юры.</p>
<h2 style="font-size:16px">Дядя Вяземский</h2>
<p>В списке потерь батальона, где Фаня числится помощником начальника медицинского снабжения, в графе «адрес жены или родителей» записано: «Дядя Вяземский Алексей Андреевич, г. Тюмень, ул. Крупской, д. 15». Значит, в 1942 году у Фани в Тюмени уже был родственник, и Тюмень после войны не случайна. Отчество Андреевич говорит, что он не брат ни Павла (Давидович), ни Мины (Львовна). Скорее всего, это муж одной из их сестёр, но это моё предположение. В Памяти народа его нет.</p>
<h2 style="font-size:16px">Анатолий: два полка и одна фотография</h2>
<p>Сначала Анатолий не находился. Память народа склеила в одну карточку восемь документов двух человек: Анатолия Ивановича Постовалова 1924 года рождения и его тёзки 1920 года рождения из Контерово. Помогли два документа, прочитанные по изображениям. Первый это список уточнения потерь 798-го полка с пунктом 198. Второй это приказ № 10/н 87-й гвардейской дивизии от 30 апреля 1944 года: в пункте 27 орденом Красной Звезды награждён гвардии лейтенант Постовалов Анатолий Иванович, командир пулемётной роты 262-го гвардейского полка. Фотографию с офицерской карточки этого полка семья узнала: на ней дед. Поэтому оба полка его.</p>
<p>Путь по документам такой. В июле 1941 года в 17 лет его призвал Свердловский горвоенкомат. В 1942 году он лейтенант и командир взвода в 798-м полку 140-й дивизии. Эту дивизию 17–19 июля 1942 года окружили южнее Миллерово, а 19 августа расформировали. Что было с ним самим, неизвестно: Память народа индексирует запись как «в плену (освобождён)», в самом листе причина не читается. Как он попал из 140-й дивизии в 87-ю гвардейскую, документов нет. В 1944 году он гвардии лейтенант. «Гвардии» здесь не повышение: так называют звание в гвардейской части. Единственное повышение это старший лейтенант к 1945 году.</p>
<p>В апреле 1944 года дивизия прошла Перекоп: 8 апреля атака, 21 апреля она получила название «Перекопская». Семья говорит, что Анатолий брал Сапун-гору. Журнал боевых действий дивизии помещает 262-й полк севернее города: 8 мая 261-й и 262-й полки переправились через Северную бухту у Инкерманского маяка и взяли высоту 144,4, а 9 мая дошли до окраины Севастополя. Сапун-горы в прочитанных страницах нет. Скорее всего, в семье «Сапун» стало названием для всего штурма Севастополя, но это моё предположение.</p>
<p>После мая 1944 года ни один документ не говорит, где он был. Дивизия ушла в Прибалтику и Восточную Пруссию. Карточка называет 262-й полк последней частью, конец службы 26–29 сентября 1945 года, а другая карточка ставит его в 382-й запасной полк, откуда он убыл 8 октября 1945 года. Семья знает, что он был ранен, а в картотеке ранений записи нет. Искать её надо в офицерской карточке в ЦАМО.</p>
<h2 style="font-size:16px">Погибшие Даниловы из Сатки</h2>
<p>В Памяти народа нашлись трое молодых Даниловых из Сатки, которых Geni записывает родственниками: Александр Сергеевич (1922) призван 8 мая 1941 года и пропал без вести в декабре 1941, Николай Леонидович (1921) призван в феврале 1942 года и убит 5 июня того же года, Георгий Александрович (1924) убит в марте 1943 года и лежит в братской могиле. Его брат Константин (1921–2018), по Geni, стал военным лётчиком и написал книгу, которую цитирует профиль Екатерины Даниловой. Самого Константина по имени и году в Памяти народа найти не удалось.</p>
<h2 style="font-size:16px">Земанек из Простеева</h2>
<p>Муж сестры Нины, Владимир Леопольдович Земанек, родился в 1921 году в Чехословакии, в Простееве, и воевал в Красной Армии: гвардии капитан, 20-я гвардейская дивизия, потом самоходно-артиллерийский полк. Чехословацкая линия в семье, о которой в Geni ничего не сказано, начинается с него.</p>
<h2 style="font-size:16px">Трусканов и вопрос о Мине</h2>
<p>Родные нашли, что похороны Павла Геера устроила Александра Львовна Трусканова, родом из Невеля. В Памяти народа есть Наум Львович Трусканов, 1902, из Невеля, убитый под Ленинградом в декабре 1941 или январе 1942 года. Отчество у Александры и Наума то же, что у Мины Львовны. Возможно, Мина была их сестрой. Это пока гипотеза: ей нужна запись, например акт о браке Павла и Мины или метрика Мины.</p>
<h2 style="font-size:16px">Что за ордена</h2>
<p>У Романа и Фани в Памяти народа стоит орден Отечественной войны II степени, у Анатолия I степени. Все три карточки из юбилейной картотеки 6 апреля 1985 года. Тот указ в марте 1985 года дал орден почти всем ветеранам: около 2,05 млн человек I степени и около 5,4 млн II степени. Условия выбора степени в найденных источниках не названы, так что орден не говорит о подвиге. Он говорит, что человек числился ветераном, и это интересно для Романа и Фани: после записи «пропал без вести» государство признало их участниками войны.</p>
<p class="hint">Орден Красной Звезды Анатолия подтверждён приказом 1944 года. В наградном списке 262-го полка у него год рождения 1920, скорее всего это ошибка записи, но тёзка 1920 года не исключён.</p>
<h2 style="font-size:16px">Отец Романа и приход мануфактуры</h2>
<p>В графе «адрес жены или родителей» у Романа записан отец: «Скоробогатов Иван Иванович, Московская область, г. Высоковск, рабочий посёлок» (номер дома читается неуверенно). Матери там нет. В Памяти народа Ивана Ивановича найти не удалось, два помощника по открытым сайтам тоже ничего не нашли.</p>
<p>Яндекс.Архив ищет без входа в аккаунт, и он показал приход Высоковской мануфактуры: Воскресенская церковь Николо-Железовского погоста Клинского уезда. Метрические книги этой церкви выложены за каждый год с 1891 по 1913. Среди примерно 370 записей о мануфактуре Скоробогатовых в них нет. Книг за 1914–1916 годы в сети нет, а Роман родился в 1915, поэтому возможно, что семья пришла на мануфактуру после 1913 года. Иван Иванов Скоробогатов, крестьянин из Спас-Коркодино Соголевской волости, встречается в книгах 1910-х годов, но связи с Романом нет, он пока тёзка. Письмо в ЦГА Москвы о книгах 1914–1916 годов подготовлено и не отправлено.</p>
<h2 style="font-size:16px">Один батальон на двоих</h2>
<p>Роман значится в списке потерь того же 380-го батальона (строка 87, под списком подпись командира 380 омедсб), как и Фаня. Скорее всего, они познакомились в этом батальоне. 20 августа 1942 года без вести записали сразу нескольких его бойцов, среди них старшего фельдшера Кокотееву. Запись о ней и о Фане отменена одним письмом Тюменского военкомата, значит, обе остались живы и вернулись.</p>
<h2 style="font-size:16px">Домачево: местечко, которого больше нет</h2>
<p>Военная база назвала место рождения Павла Геера: Домачево, у Буга, примерно в 40 км к югу от Бреста. Акт 1920 года говорит о том же. До войны в местечке жили около четырёх тысяч человек, почти все евреи. Гетто создали осенью 1941 года, в феврале 1942 года в нём было 3316 евреев, а 18 или 20 сентября 1942 года их расстреляли. Число жертв в источниках разное: Яд Вашем называет 2700, «Яхад» около 1000 для этого дня, на плитах мемориала около 120 имён и надпись «3693 неизвестных». К июлю 1944 года, по одному источнику, осталось около десяти человек.</p>
<p>Павел уехал из Домачева до 1920 года, до того как местечко в 1921 году стало польским. Его родные, если они остались, погибли, скорее всего, в 1942 году, и это объясняет, почему у семьи нет ни документов, ни рассказов о них. Фамилии Геер нет на плитах, но список неполный и ничего не опровергает. Еврейские метрические книги Домачева за 1893 год не нашлись ни в одном открытом каталоге, следующий шаг это письмо в Национальный исторический архив Беларуси в Гродно.</p>
<h2 style="font-size:16px">Где поиск остановился</h2>

function legend(){
  const box=document.getElementById('legend'); box.innerHTML='';
  const all=slots().filter(s=>s.g>0), ppl=all.filter(s=>!s.gap).map(s=>s.p), gaps=all.filter(s=>s.gap).length;
  const add=(c,txt,n,hatch)=>{if(n===0)return;const s=document.createElement('span');const i=document.createElement('i');i.style.background=c;if(hatch)i.style.backgroundImage=`repeating-linear-gradient(45deg,transparent 0 3px,${css('--ink')} 3px 4px)`;s.appendChild(i);s.appendChild(document.createTextNode(txt+(n!=null?' · '+n:'')));box.appendChild(s)};
  if(S.color==='line') Object.keys(LINES).filter(k=>k!=='self').forEach(k=>add(css('--l-'+k),LINES[k],ppl.filter(p=>p.line===k).length));
  else if(S.color==='conf') [4,3,2,1].forEach(k=>add(css('--c'+k),CONF[k].k+': '+CONF[k].t,ppl.filter(p=>p.conf===k).length,k===1));

  add(css('--gap'),'не найдено / скрыто',gaps);
}
function tip(ev,p){

 {v:'open',c:'Они были в окружении, боялись ареста и поэтому всю жизнь жили в Тюмени (теория семьи).',who:'догадка в разговоре родных',h:'Приказ № 227 от 28 июля 1942 года действительно создал заградотряды и штрафные части под Сталинградом, так что страх такого времени был реальным. Но в документах нет ни ареста, ни ограничений. В 1985 году обоим вручили орден Отечественной войны II степени от имени министра обороны СССР, а запись о Фане отменена приказом. Против версии то, что оба признаны ветеранами. О чувствах документы молчат.',s:'Личное дело в ЦАМО и воспоминания родных о том, почему семья не уезжала.',u:'https://www.marxists.org/russkij/stalin/t15/t15_23.htm',us:'текст приказа № 227'},
 {v:'likely',c:'Николай Иванович Баженов был директором Первоуральского новотрубного завода (мемуары в Geni).',who:'цитата из книги К. А. Данилова в Geni',h:'Список директоров завода называет «1937–1938 Н. И. Баженов», после И. С. Мельникова и перед Я. П. Осадчим. Но в списке только инициалы и годы. Книга Данилова называет «Баженова» дважды и без имени, один раз в 1936 году (раньше начала списка), другой раз в войну, когда директором был Осадчий. Возможно, автор называет завод по семейной привычке или имеет в виду Старотрубный завод.',s:'Фонд Р-2521 в архиве Свердловской области: приказы и кадровые документы 1937–1938 годов.',u:'https://ibprom.ru/pervouralskiy_novotrubnyy_zavod',us:'о заводе'},
 {v:'ok',c:'Книга К. А. Данилова «Я летал на самолётах, летаю, и буду летать» (Екатеринбург, 2012) существует.',who:'цитата в Geni',h:'Книга лежит на Geni как загруженный документ, 94 страницы с распознанным текстом. Имя «Николай Николаевич» в ней не встречается: Баженов назван дважды, только по фамилии. Прежнее расхождение между Николаем Николаевичем и Николаем Фёдоровичем снято.',s:'Проверено.'},
 {v:'likely',c:'Роман родился в «деревне Клин, Тверская область» (Geni).',who:'Geni',h:'Память народа даёт город Высоковск Московской области, а Высоковск стоит в Клинском районе. Скорее всего, в Geni перепутаны город и район.',s:'Запись о рождении 1915 года (метрическая книга Высоковска) и учётно-послужная карточка.'},
 {v:'likely',c:'Павел Геер прожил жизнь в Петербурге.',who:'семейный рассказ',h:'Документы 1941–1943 годов ставят его в Павловск (Слуцкий РВК) и в ленинградские госпитали. Для более поздних лет подтверждений нет.',s:'Адресная книга Ленинграда 1950-х, акт о смерти, кладбищенские книги.'},
 {v:'ok',c:'Геер была еврейской семьёй из Белоруссии.',who:'семейный рассказ',h:'Павел Геер сам записан «еврей» в регистрационной карточке Ленинградского пересыльного пункта от 17.10.1941 (изображение). Домачево в 1938 году было местечком, где жили почти одни евреи, а в 1942 году большую часть общины расстреляли. Имя Мина Львовна и фамилия укладываются в эту картину, Анкета Юрия, где написано «все русские», этому прямо не противоречит, потому что в такие анкеты национальность вносили по паспорту.',s:'Записи Домачева (еврейские метрические книги, ревизские сказки) и родословные Мины Львовны.',u:'https://kehilalinks.jewishgen.org/Domachevo/docs/Domchevo_by_Paul_Lustgarten.pdf',us:'Домачево по воспоминаниям'},
 {v:'ok',c:'Павловск до 1944 года назывался Слуцк, поэтому «Слуцкий РВК» в документах Павла означает Павловск.',who:'вывод из документов',h:'Энциклопедия Санкт-Петербурга подтверждает название Слуцк в 1918–1944 годах. Немцы занимали город с 16 сентября 1941 до 24 января 1944.',s:'Проверено.',u:'https://www.encspb.ru/object/2804000603?lc=en',us:'энциклопедия СПб'},
 {v:'open',c:'Мина Львовна была сестрой Александры и Наума Трускановых из Невеля.',who:'догадка по отчеству и по семейному рассказу',h:'Отчество Львовна/Львович одинаковое, Невель называет семья и подтверждает карточка Наума Львовича Трусканова (1902, Невель, убит в 1941–42). Но для другой Львовны это тоже подходит. Против версии ничего не найдено, и ничего её не доказывает.',s:'Акт о браке Павла и Мины (около 1919), метрика Мины, запись о смерти Александры Трускановой.',u:'https://pamyat-naroda.ru/heroes/person-hero102185027/',us:'карточка Наума Трусканова'},
 {v:'open',c:'Лев, брат Фани, погиб в 1942 году в 18 лет (семья).',who:'семейный рассказ',h:'В Памяти народа есть Лев Павлович Геер, родившийся в 1922 году в Рыбинске, призывник Слуцкого РВК: один документ из списков призыва. Записи о гибели я не нашла. Если он родился в 1922, то в 1942 ему было 20, а не 18.',s:'Рыбинский архив (акт о рождении около 1922), списки призыва и демобилизации, донесения о потерях.',u:'https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat11405311/',us:'карточка Льва'},
 {v:'ok',c:'229-я дивизия была под Сталинградом летом 1942 года.',who:'Память народа и семейный рассказ',h:'Две независимые работы говорят, что в июле 1942 года дивизия вошла в 64-ю армию, а в начале августа её передали 62-й армии, оборонявшей Сталинград. Это совпадает с записями о Фане и Романе.',s:'Проверено в общих чертах. Подробные сводки в книге «В окопах Сталинграда».',u:'https://geosib.sgugit.ru/upload/geosibir/sborniki/2022/tom-5/079-088.pdf',us:'сборник ГГУ'},
 {v:'likely',c:'Фаня была фармацевтом (консультант), по семейной версии медсестрой.',who:'ответы консультанта и семья',h:'В списке потерь её должность «помощник начальника медицинского снабжения» батальона. Эта работа связана с аптекой и медицинским имуществом, поэтому «фармацевт» подходит лучше, чем «медсестра». Звание техник-интендант 2 ранга подходит к этой должности. Училище в Павловске в сети не найдено.',s:'Личное дело Фани, диплом, анкеты в архиве завода в Тюмени.'},

 {v:'ok',c:'Роман и Фаня служили в одной части: 229-я дивизия, 380-й медико-санитарный батальон.',who:'Память народа',h:'Оба названы в списках потерь 380-го батальона на изображениях: Фаня в строке 18, Роман в строке 87 списка, который подписал командир батальона.',s:'Проверено по изображениям.'},

function checkPane(pane){
  pane.appendChild(el('h2',null,'Что из сказанного правда'));
  pane.appendChild(el('p','hint','Я проверила по открытым источникам каждую версию, которая встретилась в Geni, в разговоре с Лизой и в ответах консультанта. Часть можно закрыть сразу. Часть решат только архивы, для них указано, какое дело нужно.'));
  const cnt={ok:0,likely:0,open:0,no:0};CLAIMS.forEach(c=>cnt[c.v]++);
  const sum=el('p');['ok','likely','open','no'].forEach(k=>{const b=el('span','badge',VERDICT[k][0]+' · '+cnt[k]);b.style.color='var('+VERDICT[k][1]+')';sum.appendChild(b)});pane.appendChild(sum);
  ['no','open','likely','ok'].forEach(k=>{
    CLAIMS.filter(c=>c.v===k).forEach(c=>{
      const box=el('div','src');
      const b=el('span','badge',VERDICT[k][0]);b.style.color='var('+VERDICT[k][1]+')';box.appendChild(b);
      box.appendChild(el('b',null,c.c));
      box.appendChild(el('div','hint','Откуда: '+c.who));
      const hh=el('div');hh.style.margin='4px 0';hh.appendChild(document.createTextNode(c.h));
      if(c.u){hh.appendChild(document.createTextNode(' '));const a=el('a',null,'('+c.us+')');a.href=c.u;a.target='_blank';a.rel='noopener';hh.appendChild(a)}
      box.appendChild(hh);
      const sd=el('div','hint');sd.appendChild(el('b',null,'Чем решить: '));sd.appendChild(document.createTextNode(c.s));box.appendChild(sd);
      box.style.paddingBottom='10px';box.style.borderBottom='1px solid var(--rule)';
      pane.appendChild(box);
    });
  });
}

  ['1–9 мая 1944','Севастополь, северный сектор: 8 мая 261-й и 262-й полки переправились через Северную бухту у Инкерманского маяка и взяли высоту 144,4. Сапун-горы в журнале нет, в семье говорят «Сапун»','ДОКУМЕНТ'],
  ['после мая 1944','Ни один документ не помещает его на Балтику и в Восточную Пруссию. Карточка: конец службы 26–29.09.1945; 382-й запасной полк, убыл 08.10.1945 в Сталинский РВК. Было ранение (семья), в картотеке ранений записи нет','БАЗА'],
  ['фото','Семья узнала его на фотографии с офицерской карточки 262 гв. сп. В 1985 году орден Отечественной войны I степени, юбилейная картотека, № 89','СЕМЬЯ']]}
];
const WARCTX=[
 ['229-я стрелковая дивизия','Было два формирования: март–декабрь 1941 и с декабря 1941 по июль 1945. Второе формировалось с декабря 1941 года в Ишиме в Сибирском военном округе, и 380-й медико-санитарный батальон входил в его состав. В июле 1942 дивизия держала реку Чир в 64-й армии, со 2 августа она в 62-й, 7–12 августа её разгромили в Калачском котле. В самом Сталинграде она не воевала. 20 августа в ней насчитали 278 штыков, а в сентябре дивизию отвели под Москву.','https://geosib.sgugit.ru/upload/geosibir/sborniki/2022/tom-5/079-088.pdf','сборник ГГУ'],
 ['281-я стрелковая дивизия (Павел)','Источники расходятся. По англоязычной Википедии, дивизия формировалась в Ленинграде с 10 июля 1941 и вскоре ушла на север против Финляндии. Другой сайт пишет, что она воевала в блокаде. Истории 816-го артиллерийского полка я не нашла.','https://en.wikipedia.org/wiki/281st_Rifle_Division','Википедия'],
 ['8-я армия, Волховское направление','Немецкое наступление на Тихвин началось 28 октября 1941 года, Тихвин пал 8 ноября. Павла направили в штаб 8-й армии 17 октября, за одиннадцать дней до этого.','https://cyclowiki.org/wiki/%D0%A5%D1%80%D0%BE%D0%BD%D0%B8%D0%BA%D0%B0_%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%BE%D0%B9_%D0%9E%D1%82%D0%B5%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D0%BE%D0%B9_%D0%B2%D0%BE%D0%B9%D0%BD%D1%8B_(%D0%BE%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C_1941_%D0%B3%D0%BE%D0%B4%D0%B0)','Циклопедия'],
 ['87-я гвардейская дивизия (Анатолий)','Создана 16.04.1943 из 300-й стрелковой дивизии, отмеченной за прорыв южнее Сталинграда в ноябре 1942 года. 262-й гвардейский полк вырос из 1051-го стрелкового. Миус и Донбасс, Перекоп (6 апреля 1944), Севастополь (9 мая 1944), потом Литва, Курляндия и Восточная Пруссия.','https://en.wikipedia.org/wiki/87th_Guards_Rifle_Division','Википедия'],
 ['140-я стрелковая дивизия (Анатолий, 1942)','Третье формирование с декабря 1941 года, в конце мая 1942 отправлено на юг в 24-й армии. 17–19 июля 1942 окружено южнее Миллерово, большая часть погибла при выходе, 19 августа расформировано. Пометка «Донской фронт» в списке 798-го полка не объяснена.','https://en.wikipedia.org/wiki/140th_Rifle_Division','Википедия'],
 ['Орден Отечественной войны, 1985','Указом от 11 марта 1985 года орден получили почти все ветераны: около 2,05 млн человек I степени и около 5,4 млн II степени. Условия выбора степени в найденных источниках не названы, поэтому сам орден не говорит о конкретном подвиге. Роман и Фаня получили II степень, Анатолий Постовалов I степень.','https://novayagazeta.ru/amp/articles/2010/04/23/3683-ob-ordene-otechestvennoy-voyny','Новая газета']
];
function warPane(pane){
  pane.appendChild(el('h2',null,'Где они были на войне'));
  pane.appendChild(el('p','hint','Здесь собрано, что показали документы: часть, даты и чем кончилось. Даты демобилизации ни у кого пока не найдены, для них нужны личные дела в ЦАМО.'));
  WAR.forEach(w=>{
    pane.appendChild(el('h2',null,w.n));
    const ul=el('ul');
    w.st.forEach(([d,tx,k])=>{
      const li=el('li');
      li.appendChild(el('b',null,d+': '));
      li.appendChild(document.createTextNode(tx+' '));
      const col={'ДОКУМЕНТ':'--c4','БАЗА':'--c3','СЕМЬЯ':'--c2','ИСТОРИЯ':'--muted','—':'--muted'}[k]||'--muted';
      const b=el('span','badge',k);b.style.color='var('+col+')';li.appendChild(b);
      ul.appendChild(li);
    });
    pane.appendChild(ul);
  });
  pane.appendChild(el('h2',null,'Что известно об этих частях и об орденах'));
  WARCTX.forEach(([n,tx,u,us])=>{
    const d=el('div','src');d.appendChild(el('b',null,n+'. '));d.appendChild(document.createTextNode(tx+' '));
    const a=el('a',null,'('+us+')');a.href=u;a.target='_blank';a.rel='noopener';d.appendChild(a);pane.appendChild(d);
  });
}

function coverage(pane){
  const saved=S.gens;S.gens=6;const all=slots().filter(s=>s.g>=1);S.gens=saved;
  const names=['','родители','дедушки и бабушки','прадеды','прапрадеды','3-и прадеды','4-е прадеды'];
  const sideOf=s=>s.i<Math.pow(2,s.g-1)?'f':'m';
  const mk=(side,color,title)=>{
    const box=el('div');box.appendChild(el('h3',null,title));
    for(let g=1;g<=6;g++){
      const tot=Math.pow(2,g-1), have=all.filter(s=>s.g===g&&!s.gap&&sideOf(s)===side).length;
      const r=el('div','bar');r.appendChild(el('span','lab',names[g]));
      const trk=el('span','trk');const f=el('span','fil');f.style.width=(100*have/tot)+'%';f.style.background=color;trk.appendChild(f);r.appendChild(trk);
      r.appendChild(el('span','num',have+' из '+tot));box.appendChild(r);
    }
    return box;
  };
  pane.appendChild(el('h2',null,'Сколько предков найдено'));
  pane.appendChild(el('p','hint','На каждом поколении возможно вдвое больше мест, чем на предыдущем. Полоса показывает, сколько мест заполнено.'));
  const cols=el('div','cols');cols.appendChild(mk('f',css('--l-sk'),'Отцовская сторона'));cols.appendChild(mk('m',css('--l-ba'),'Материнская сторона'));pane.appendChild(cols);
  const found=all.filter(s=>!s.gap);
  const cnt=k=>found.filter(s=>s.p.conf===k).length;
  pane.appendChild(el('h2',null,'Чем подтверждено'));
  const ul=el('ul');
  [4,3,2,1].forEach(k=>{const li=el('li');const b=el('span','badge',CONF[k].k);b.style.color='var(--c'+k+')';li.appendChild(b);li.appendChild(document.createTextNode(cnt(k)+' '+(cnt(k)===1?'человек':'человек')+': '+CONF[k].t));ul.appendChild(li)});
  pane.appendChild(ul);
  const sec=(title,items)=>{pane.appendChild(el('h2',null,title));const u=el('ul');items.forEach(x=>u.appendChild(el('li',null,x)));pane.appendChild(u)};
  sec('Чего не хватает',[
    'На отцовской стороне найден отец Романа, Иван Иванович. Мать Романа, родители Ивана, родители Павла Геера и родители Мины Львовны не найдены.',
    'На материнской стороне найден отец Анатолия, Иван Данилович: его назвал список 1942 года. Его жена и годы жизни неизвестны. Остальные связи из Geni в оригиналах не прочитаны.',
    'Для матери и её родителей нет документов, кроме военных документов Анатолия.',
    'Неизвестно, откуда родом Мина Львовна.',
    'Нет записей о рождении Юрия (1943) и о браке Романа и Фани (1942).',
    'Неизвестно, как Анатолий попал из 140-й дивизии в 87-ю гвардейскую, где он был после мая 1944 года и когда и где его ранило.'
  ]);
  sec('Что можно сделать дальше, по убыванию пользы',[
    'Иван Иванович Скоробогатов, отец Романа, Высоковск. Приход мануфактуры найден: Воскресенская церковь Николо-Железовского погоста. Книги 1891–1913 годов выложены, Скоробогатовых в них нет, книг 1914–1916 годов в сети нет. Дальше: письмо в ЦГА Москвы (Ф.203 Оп.780, Ф.1471) о книгах 1914–1916 годов и о возможном отдельном Высоковском приходе, письмо в ЦГАМО и в Клинский архив о документах мануфактуры. Черновики готовы, не отправлены.',
    'Домачево: письмо в Национальный исторический архив Беларуси в Гродно, где хранятся еврейские метрические книги Домачева и сохранился ли 1893 год. Это путь к родителям Павла Геера.',
    'ЦАМО: личные дела и офицерские карточки Анатолия (262-й гвардейский полк, наградной лист на Красную Звезду, журнал полка за апрель–май 1944), Фани и Романа (Ф.58 Оп.818883 Д.1755, Ф.56 Оп.12220 Д.79). Заказ идёт через гражданина РФ.',
    'Архив Свердловской области, фонд Р-2521 (Первоуральский новотрубный завод): приказы и кадровые документы 1937–1938 годов покажут, как назначили и как освободили Николая Баженова.',
    'Попросить родных прислать акт о смерти Мины (20.03.2025) и всё, что они нашли после сентября 2025.',
    'Мама: откуда у семьи «Сапун», рассказы о 1942 годе и плене, в какой школе учился Анатолий, что известно о ранении, имена и годы родителей Анатолия, документы и подписанные фотографии.',
    'Записи о рождении Юрия и о браке Романа и Фани в ЗАГС Тюмени.',
    'Geni: прочитать братьев и сестёр предков (74 профиля), потом двоюродных (122). Любая связь остаётся гипотезой, пока её не подтвердит запись.'
  ]);
  sec('Кто может помочь',[
    'Родные, которые уже собрали документы по Геер и Скоробогатовым.',
    'Мама: единственный живой свидетель материнской линии.',
    'Семья Земанек: ведёт многие материнские профили в Geni. Связываться только по согласованию в семье.'
  ]);
}

function showPane(){
  const pane=document.getElementById('pane'); pane.innerHTML='';
  if(TAB==='log'){pane.innerHTML=LOG;return}
  if(TAB==='cov'){coverage(pane);return}
  if(TAB==='places'){placesPane(pane);return}
  if(TAB==='check'){checkPane(pane);return}
  if(TAB==='war'){warPane(pane);return}
  if(S.sel){
    const p=P[S.sel];
    pane.appendChild(el('div','pname',p.n));
    pane.appendChild(el('div','pyears',yrs(p)+(p.place?' · '+p.place:'')));
    const bd=el('p');const b=el('span','badge',CONF[p.conf].k);b.style.color='var(--c'+(p.conf)+')';bd.appendChild(b);bd.appendChild(document.createTextNode(CONF[p.conf].t+' · линия: '+LINES[p.line]));pane.appendChild(bd);
    pane.appendChild(el('h2',null,'Источники и заметки'));
    p.src.forEach(([c,t])=>{const d=el('div','src');const b=el('span','badge',CONF[c].k);b.style.color='var(--c'+c+')';d.appendChild(b);d.appendChild(document.createTextNode(t));pane.appendChild(d)});
    if(p.note) pane.appendChild(el('p',null,p.note));
    const par=[['Отец',p.f],['Мать',p.m]];
    const ul=el('ul');
    par.forEach(([l,id])=>{const li=el('li');li.appendChild(document.createTextNode(l+': '));if(id){const a=el('a',null,P[id].n);a.href='#';a.onclick=e=>{e.preventDefault();S.sel=id;draw();showPane()};li.appendChild(a)}else li.appendChild(document.createTextNode('не найден'));ul.appendChild(li)});
    pane.appendChild(el('h2',null,'Родители'));pane.appendChild(ul);
    const back=el('p','hint');const a=el('a',null,'← к истории');a.href='#';a.onclick=e=>{e.preventDefault();S.sel=null;draw();showPane()};back.appendChild(a);pane.appendChild(back);
    return;
  }
  pane.innerHTML=STORY;
  pane.querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();S.sel=a.dataset.id;draw();showPane()});
}

/* controls */
const $=id=>document.getElementById(id);
$('gens').oninput=e=>{S.gens=+e.target.value;$('gensO').textContent=S.gens;syncControls();draw()};
$('year').oninput=e=>{S.year=+e.target.value;$('yearO').textContent=S.year<=1790?'все':S.year;draw()};
const THR=['','все','от семьи','от базы','только документ'];
$('thr').oninput=e=>{S.thr=+e.target.value;$('thrO').textContent=THR[S.thr];draw()};
const VIEWS={line:{color:'line',span:180,gens:6},region:{color:'region',span:270,gens:5},conf:{color:'conf',span:180,gens:6}};
function syncControls(){
  $('gens').value=S.gens;$('gensO').textContent=S.gens;$('color').value=S.color;
  document.querySelectorAll('#spanSeg button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===S.span));
  document.querySelectorAll('#viewSeg button').forEach(x=>{const v=VIEWS[x.dataset.v];x.setAttribute('aria-pressed',v.color===S.color&&v.span===S.span&&v.gens===S.gens)});
}
$('color').onchange=e=>{S.color=e.target.value;syncControls();draw()};
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{Object.assign(S,VIEWS[b.dataset.v]);S.sel=null;syncControls();draw();showPane()});
$('q').oninput=e=>{S.q=e.target.value.trim();draw()};
document.querySelectorAll('#spanSeg button').forEach(b=>b.onclick=()=>{S.span=+b.dataset.v;syncControls();draw()});
function setTab(k){TAB=k;[['story','tabStory'],['places','tabPlaces'],['war','tabWar'],['check','tabCheck'],['cov','tabCov'],['log','tabLog']].forEach(([n,i])=>$(i).setAttribute('aria-selected',n===k));if(k!=='story')S.sel=S.sel;showPane()}
$('tabStory').onclick=()=>setTab('story');$('tabCov').onclick=()=>setTab('cov');$('tabPlaces').onclick=()=>setTab('places');$('tabCheck').onclick=()=>setTab('check');$('tabWar').onclick=()=>setTab('war');$('tabLog').onclick=()=>setTab('log');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
draw();showPane();
</script>
